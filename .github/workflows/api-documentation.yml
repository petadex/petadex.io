name: Generate API Documentation

on:
  # Trigger when route files change
  push:
    branches:
      - main
    paths:
      - 'backend/scripts/generate-api-docs.js'
      - '.github/workflows/api-documentation.yml'
      - 'backend/src/routes/**'
      - 'backend/src/app.js'
  # Manual trigger
  workflow_dispatch:
  # PR checks
  pull_request:
    paths:
      - 'backend/scripts/generate-api-docs.js'
      - '.github/workflows/api-documentation.yml'
      - 'backend/src/routes/**'
      - 'backend/src/app.js'

permissions:
  contents: write       # Needed to commit docs and push to wiki
  pull-requests: write  # Needed for the "Comment on PR" step

jobs:
  generate-api-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better commit messages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate API documentation
        working-directory: ./backend
        # Imports src/app.js and walks the mounted Express router, so documented
        # paths are exactly what is served. No DB/AWS access needed.
        run: node scripts/generate-api-docs.js

      - name: Check if documentation changed
        id: check_changes
        run: |
          echo "Checking for changes in documentation..."
          if git diff --exit-code backend/docs/API_DATABASE_DEPENDENCIES.md; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected!"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "Git status:"
          git status backend/docs/

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/docs/API_DATABASE_DEPENDENCIES.md
          git commit -m "docs: auto-update API database dependencies [skip ci]"
          git push

      - name: Update GitHub Wiki
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          echo "📚 Attempting to clone wiki repository..."

          # Clone the wiki repository (skipped gracefully if wiki is not initialized)
          if ! git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki 2>&1; then
            echo "⚠️  Wiki not available — skipping wiki update."
            echo "👉 To enable: Wiki tab → Create the first page, then re-run this workflow."
            exit 0
          fi

          echo "✅ Wiki repository cloned successfully"

          cd wiki

          echo "📝 Creating API Documentation page..."

          # Create or update the API Documentation page
          cat > "API-Documentation.md" << 'WIKI_EOF'
          # API Documentation

          The API queries the database backend for display by the frontend.

          This documentation is automatically generated from the route files and shows which database tables and columns each endpoint depends on. This helps identify breaking changes as the database schema evolves.

          ---

          WIKI_EOF

          # Append the generated documentation (skip the title since we have our own)
          tail -n +3 ../backend/docs/API_DATABASE_DEPENDENCIES.md >> "API-Documentation.md"

          echo "📄 Generated wiki content:"
          wc -l "API-Documentation.md"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push if there are changes
          git add "API-Documentation.md"
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to wiki"
          else
            echo "💾 Committing changes to wiki..."
            git commit -m "Auto-update API documentation"

            echo "🚀 Pushing to wiki..."
            git push

            echo "✅ Wiki updated successfully!"
          fi

          cd ..
          rm -rf wiki

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: backend/docs/API_DATABASE_DEPENDENCIES.md
          retention-days: 30

      - name: Comment on PR (if PR)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const docPath = 'backend/docs/API_DATABASE_DEPENDENCIES.md';

            if (fs.existsSync(docPath)) {
              const content = fs.readFileSync(docPath, 'utf8');

              // Extract just the quick reference table
              const tableMatch = content.match(/## Quick Reference\n\n([\s\S]*?)\n---/);
              const table = tableMatch ? tableMatch[1] : 'No changes detected';

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📚 API Documentation Updated\n\nRoute changes detected. Here's the quick reference:\n\n${table}\n\n[View full documentation](../blob/${context.sha}/backend/docs/API_DATABASE_DEPENDENCIES.md)`
              });
            }

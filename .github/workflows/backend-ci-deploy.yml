name: Backend CI & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-deploy.yml'
  # PRs run build_and_test only; the deploy job is skipped for pull_request.
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-deploy.yml'
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Run tests
        run: cd backend && npm test
      # Imports src/app.js and walks every mounted route (no DB/AWS needed), so a
      # broken route import fails here instead of in the deployed Lambda.
      - name: Verify app loads and routes mount
        run: cd backend && npm run docs:api

  deploy:
    needs: build_and_test
    # Forks without AWS credentials should not fail CI after tests pass.
    # Never deploy from a PR — only from push to main or a manual dispatch.
    if: github.repository == 'petadex/petadex.io' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Deploy via Serverless Framework
        working-directory: backend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DB_HOST: petadex.ccz9y6yshbls.us-east-1.rds.amazonaws.com
          DB_PORT: "5432"
          DB_NAME: petadex
          DB_USER: readonly_user
          DB_PASS: petadex
          # Builds a caller may pin a search to (comma-separated). Empty = pinning off.
          SEARCH_PINNABLE_VERSIONS: petadex_seq_v260701_20261026_202443
          # SEARCH_LAMBDA_NAME / RESULTS_BUCKET / RESULTS_PREFIX intentionally omitted —
          # serverless.yml defaults (petadex-diamond-orchestrator / petadex / results)
          # are the source of truth. To flip the search Lambda without a code deploy,
          # add a SEARCH_LAMBDA_NAME repository secret here.
        run: npx serverless@3 deploy --stage dev
